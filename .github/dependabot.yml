# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keep npm dependencies up to date
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00' # UTC timezone (all times in dependabot.yml use UTC)
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'npm'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
    ignore:
      # eslint 10 and TypeScript 7 are both blocked by eslint-config-next, not
      # by this project's own code. Re-verified against eslint-config-next
      # 16.3.0 rather than assumed:
      #   eslint 10.8.0    -> its bundled eslint-plugin-react calls
      #                       context.getFilename(), removed in eslint 10:
      #                       "TypeError: contextOrFilename.getFilename is not a
      #                       function" while loading rule 'react/display-name'.
      #   typescript 7.0.2 -> `next build` type-checks fine (and ~3x faster),
      #                       but the bundled typescript-eslint fails to load,
      #                       so `npm run lint` dies and CI goes red.
      # Drop the matching entry once eslint-config-next ships support; both are
      # worth retrying, TypeScript 7 especially.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node major tracks the Node major it describes. The workflows pin
      # Node 24, so a bump to 26 would type against a runtime CI does not run.
      # Raise this together with node-version in ci.yml, deploy.yml and
      # post-deploy-smoke.yml, never on its own.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      # Group all npm production dependencies together
      # Note: Major version updates are excluded and handled individually
      # to allow careful review of potentially breaking changes
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # Group all npm development dependencies together
      # Note: Major version updates are excluded and handled individually
      # to allow careful review of potentially breaking changes
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # Keep GitHub Actions up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00' # UTC timezone (all times in dependabot.yml use UTC)
    # Raised from 5. The repo uses seven distinct actions, so a cap of 5 silently
    # hid available majors behind whichever PRs happened to open first — the
    # upload-artifact v4 -> v7 gap never surfaced at all while five older
    # action PRs sat open.
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      # These move together on the Pages deploy path; reviewing them as one PR
      # avoids a half-upgraded pipeline where configure-pages and deploy-pages
      # disagree about artifact format.
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
