name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The suite carries the compliance tripwires (no tracker may appear that
      # would falsify the published cookie policy; no sponsoring entity or tax
      # ID may reappear in the page layer). Without this step they gate nothing.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
